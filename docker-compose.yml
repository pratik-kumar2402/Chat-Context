services:
  ui:
    build: ./ui
    ports:
      - "5173:80"
    env_file: "./ui/.env"
    depends_on:
      - mcp
      - model

  mcp:
    build: ./mcp
    ports:
      - "3000:3000"
    env_file:
      - "./mcp/.env"

  model:
    build: ./model
    ports:
      - "8000:8000"
    env_file: "./model/.env"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./start.sh:/start.sh
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]

volumes:
  ollama-data:
